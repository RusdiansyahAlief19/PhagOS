      /* ── Teks kaya: paragraf, tebal, poin ────────────────────────────── */
      function RichText({ text }) {
        const blocks = String(text || "")
          .split("\n")
          .map((l) => l.trim())
          .filter(Boolean)
          .map((raw) => {
            const isLi = /^[-*\u2022]\s+/.test(raw);
            const body = isLi ? raw.replace(/^[-*\u2022]\s+/, "") : raw;
            const spans = body
              .split(/(\*\*[^*]+\*\*)/)
              .filter(Boolean)
              .map((part) => {
                const bold = /^\*\*[^*]+\*\*$/.test(part);
                return { text: bold ? part.slice(2, -2) : part, bold };
              });
            return { isLi, spans };
          });
        return (
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {blocks.map((b, i) => (
              <div
                key={i}
                style={{
                  display: "flex",
                  gap: 8,
                  fontSize: 13,
                  lineHeight: 1.6,
                  color: "#cfd3e5",
                  textWrap: "pretty",
                }}
              >
                {b.isLi && (

                )}
                <span>
                  {b.spans.map((s, j) => (
                    <span
                      key={j}
                      style={{
                        fontWeight: s.bold ? 600 : 400,
                        color: s.bold ? "#e9e9ed" : "#cfd3e5",
                      }}
                    >
                      {s.text}
                    </span>
                  ))}
                </span>
              </div>
            ))}
          </div>
        );
      }

                  </tbody>
                </table>
              </div>
            </section>
          </div>
        );
      }

      /* ── Halaman 2: Timeline Anomali (wajib dua kolom bersebelahan) ──── */
      function Timeline({ events }) {
        const map = (e) => ({
          key: `${e.ts}-${e.src_ip}-${e.dest_ip}`,
          time: String(e.ts || "")
            .replace("T", " ")
            .slice(0, 19),
          title: e.signature || "Aktivitas flow",
          detail: `${e.src_ip || "?"} → ${e.dest_ip || "?"}${e.dest_port ? ":" + e.dest_port : ""}${e.sid ? "  ·  SID " + e.sid : ""}`,
        });
        const sig = events.filter((e) => e.source === "signature").map(map);
        const stat = events.filter((e) => e.source !== "signature").map(map);
        const columns = [
          {
            title: "Terdeteksi Signature",
            color: "var(--color-accent)",
            events: sig,
          },

            title: "Anomali Statistik",

          <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>

                  margin: 0,

                  fontSize: 23,
                  letterSpacing: "-0.01em",

                Timeline Anomali

              <p
                style={{
                  margin: 0,
                  color: "var(--color-neutral-500)",

              </p>
            </header>

            <div
              style={{
                display: "grid",
                gridTemplateColumns: "repeat(2, minmax(0, 1fr))",
                gap: 16,
                alignItems: "start",
              }}
            >
              {columns.map((col) => (
                <section
                  key={col.title}
                  style={{
                    background: "var(--color-surface)",
                    borderRadius: "var(--radius-md)",
                    boxShadow: "var(--shadow-sm)",
                  }}
                >
                  <div
                    style={{
                      padding: "14px 16px",
                      borderBottom: "1px solid var(--color-neutral-900)",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "space-between",
                      gap: 10,
                    }}
                  >
                    <div
                      style={{ display: "flex", alignItems: "center", gap: 9 }}
                    >
                      <span
                        style={{
                          width: 7,
                          height: 7,
                          borderRadius: 2,
                          background: col.color,
                        }}
                      />
                      <span
                        style={{
                          fontFamily: "var(--font-heading)",
                          fontSize: 14,
                        }}
                      >
                        {col.title}
                      </span>
                    </div>
                    <span
                      style={{
                        fontFamily: MONO,
                        fontSize: 11,
                        color: "var(--color-neutral-600)",
                        whiteSpace: "nowrap",
                      }}
                    >
                      {col.events.length} event
                    </span>
                  </div>
                  <div style={{ padding: "6px 0" }}>
                    {col.events.map((e) => (
                      <div
                        key={e.key}
                        style={{
                          padding: "12px 16px",
                          borderBottom: "1px solid var(--color-surface)",
                          display: "flex",
                          flexDirection: "column",
                          gap: 5,
                        }}
                      >
                        <span
                          style={{
                            fontFamily: MONO,
                            fontSize: 11,
                            color: "var(--color-neutral-600)",
                          }}
                        >
                          {e.time}
                        </span>
                        <span
                          style={{ fontSize: 13, color: "var(--color-text)" }}
                        >
                          {e.title}
                        </span>
                        <span
                          style={{
                            fontFamily: MONO,
                            fontSize: 11,
                            color: "var(--color-neutral-500)",
                          }}

                      </div>

                </section>

            <div
              style={{
                border: "1px solid var(--color-accent-800)",

                borderRadius: "var(--radius-md)",
                padding: "16px 18px",
                display: "flex",
                flexDirection: "column",
                gap: 7,

              }}

              <span
                style={{
                  fontFamily: "var(--font-heading)",
                  fontSize: 13,
                  color: "var(--color-accent-300)",

                Kenapa dua kolom

              <p
                style={{
                  margin: 0,
                  fontSize: 13,

                  lineHeight: 1.55,
                  textWrap: "pretty",
                }}

                Kolom kiri adalah temuan rule Suricata: event yang sudah cocok
                dengan signature yang diketahui. Kolom kanan adalah nilai tambah
                sistem ini, event flow yang tidak cocok signature apa pun tapi

                Suricata lewatkan.

      /* ── Halaman 3: Detail Host ──────────────────────────────────────── */
      function HostDetail({ ip, detail, onBack, onAsk }) {

                display: "grid",

                gap: 16,

            >
              <section
                style={{
                  background: "var(--color-surface)",
                  borderRadius: "var(--radius-md)",
                  boxShadow: "var(--shadow-sm)",
                }}
              >
                <div
                  style={{
                    padding: "14px 16px",
                    borderBottom: "1px solid var(--color-neutral-900)",
                    fontFamily: "var(--font-heading)",
                    fontSize: 14,
                  }}
                >
                  Informasi host
                </div>
                <div style={{ padding: "4px 16px 12px" }}>
                  {rows.map((r) => (
                    <div
                      key={r.label}
                      style={{
                        display: "flex",
                        gap: 16,
                        justifyContent: "space-between",
                        padding: "11px 0",
                        borderBottom: "1px solid var(--color-surface)",
                      }}
                    >
                      <span
                        style={{
                          fontSize: 12,
                          color: "var(--color-neutral-600)",

                        }}
                      >
                        {r.label}
                      </span>
                      <span
                        style={{
                          fontSize: 12,
                          color: "var(--color-neutral-300)",
                          textAlign: "right",
                          fontFamily: r.font,
                          textWrap: "pretty",
                        }}
                      >
                        {r.value}
                      </span>
                    </div>
                  ))}
                </div>
              </section>

              <section
                style={{
                  background: "var(--color-surface)",
                  borderRadius: "var(--radius-md)",
                  boxShadow: "var(--shadow-sm)",
                }}
              >
                <div
                  style={{
                    padding: "14px 16px",
                    borderBottom: "1px solid var(--color-neutral-900)",
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    gap: 10,
                  }}
                >
                  <span
                    style={{ fontFamily: "var(--font-heading)", fontSize: 14 }}
                  >
                    Tren skor risiko
                  </span>
                  <span
                    style={{ fontSize: 11, color: "var(--color-neutral-600)" }}
                  >
                    0–100
                  </span>

                <div
                  style={{

                  {trend.map((t, i) => {
                    const ts = bandOf(t.band);
                    return (
                      <div

                        style={{
                          flex: 1,

                          gap: 8,

                          justifyContent: "flex-end",
                        }}
                      >
                        <span
                          style={{
                            fontFamily: MONO,
                            fontSize: 11,
                            color: "var(--color-neutral-500)",
                          }}
                        >
                          {t.risk_score}
                        </span>
                        <div
                          style={{
                            width: "100%",
                            borderRadius: "3px 3px 0 0",

              style={{

                border: "1px solid var(--color-accent)",

      /* ── Halaman 4: Analyst Chat ─────────────────────────────────────── */
      const CHIPS = [
        "Apa itu port scan?",
        "Arti SID 1000001?",
        "Kenapa host ini dianggap berisiko?",
        "Bedanya anomali statistik dan signature?",
      ];

      function Chat({ messages, pending, onSend }) {
        const [input, setInput] = useState("");
        const submit = (q) => {
          const v = (q ?? input).trim();
          if (!v) return;
          setInput("");
          onSend(v);
        };
        return (
          <div
            style={{
              display: "flex",
              flexDirection: "column",
              gap: 18,
              maxWidth: 900,
              width: "100%",
              flex: 1,
            }}
          >
            <header
              style={{ display: "flex", flexDirection: "column", gap: 5 }}
            >
              <h1
                style={{
                  margin: 0,
                  fontFamily: "var(--font-heading)",
                  fontWeight: 500,
                  fontSize: 23,
                  letterSpacing: "-0.01em",
                }}
              >
                Analyst Chat
              </h1>
              <p
                style={{
                  margin: 0,
                  color: "var(--color-neutral-500)",
                  fontSize: 13,
                }}
              >
                Jawaban selalu membawa sumber rujukan yang bisa dibuka.
              </p>
            </header>

            <div
              style={{
                display: "flex",
                flexDirection: "column",
                gap: 16,
                flex: 1,
              }}
            >
              {messages.map((m, i) => {
                const isUser = m.role === "user";
                return (
                  <div
                    key={i}

                      display: "flex",
                      justifyContent: isUser ? "flex-end" : "flex-start",
                    }}
                  >
                    <div
                      style={{
                        maxWidth: "78%",
                        display: "flex",
                        flexDirection: "column",
                        gap: 10,
                      }}
                    >
                      {isUser ? (
                        <div
                          style={{
                            background: "var(--color-accent-900)",
                            border: "1px solid var(--color-accent-800)",
                            borderRadius: "var(--radius-md)",
                            padding: "11px 14px",
                            fontSize: 13,
                            lineHeight: 1.55,
                            color: "var(--color-text)",
                          }}
                        >
                          {m.text}
                        </div>
                      ) : (
                        <div
                          style={{
                            background: "var(--color-surface)",
                            boxShadow: "var(--shadow-sm)",
                            borderRadius: "var(--radius-md)",
                            padding: "14px 16px",
                          }}
                        >
                          <RichText text={m.text} />
                        </div>
                      )}

                      {!isUser && m.sources && m.sources.length > 0 && (
                        <div
                          style={{
                            display: "flex",
                            flexDirection: "column",
                            gap: 7,
                          }}
                        >
                          <span
                            style={{
                              fontSize: 10,
                              letterSpacing: "0.08em",
                              textTransform: "uppercase",
                              color: "var(--color-neutral-600)",
                            }}
                          >
                            Sumber rujukan
                          </span>
                          <div
                            style={{
                              display: "flex",
                              flexWrap: "wrap",
                              gap: 8,
                            }}
                          >
                            {m.sources.map((src, j) => (
                              <a
                                key={j}
                                className="cite"
                                href={src.source_url}
                                target="_blank"
                                rel="noopener"
                                style={{
                                  display: "flex",
                                  flexDirection: "column",
                                  gap: 3,
                                  padding: "9px 12px",
                                  borderRadius: "var(--radius-md)",
                                  border: "1px solid var(--color-accent-700)",
                                  background: "var(--color-accent-900)",
                                  textDecoration: "none",
                                  maxWidth: 320,
                                }}
                              >
                                <span
                                  style={{
                                    display: "flex",
                                    alignItems: "baseline",
                                    gap: 7,
                                  }}
                                >
                                  <span
                                    style={{
                                      fontFamily: MONO,
                                      fontSize: 12,
                                      color: "var(--color-accent-300)",
                                    }}
                                  >
                                    {src.technique_id}
                                  </span>
                                  <span
                                    style={{ color: "var(--color-accent-700)" }}
                                  >
                                    ·
                                  </span>
                                  <span
                                    style={{
                                      fontSize: 12,
                                      color: "var(--color-text)",
                                    }}
                                  >
                                    {src.name}
                                  </span>
                                </span>
                                <span
                                  style={{
                                    fontSize: 10,

              {pending && (

                    fontSize: 12,

                      borderRadius: 20,
                      border: "1px solid var(--color-neutral-800)",

                      color: "var(--color-neutral-400)",
                      fontFamily: "var(--font-body)",

                  background: "var(--color-surface)",

                  padding: "8px 8px 8px 14px",
                }}
              >
                <input
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") submit();

                  placeholder="Tanya tentang host, signature, atau teknik…"

      }

      /* ── Shell: routing sederhana + semua fetch ke REST API ──────────── */
      function SentinelOps() {
        const [page, setPage] = useState("dashboard");
        const [selectedIp, setSelectedIp] = useState(null);
        const [hosts, setHosts] = useState([]);
        const [events, setEvents] = useState([]);
        const [detail, setDetail] = useState(null);
        const [messages, setMessages] = useState([]);
        const [pending, setPending] = useState(false);
        const [sample, setSample] = useState(false);
        const detailRef = useRef(null);

        const get = useCallback(async (path, fallback) => {
          try {
            const ctl = new AbortController();
            const t = setTimeout(() => ctl.abort(), 3500);
            const res = await fetch(API + path, { signal: ctl.signal });
            clearTimeout(t);
            if (!res.ok) throw new Error(res.status);
            return await res.json();
          } catch (e) {
            setSample(true); // API tak terjangkau → pakai data contoh
            return fallback;
          }
        }, []);

        const loadAssets = useCallback(async () => {
          const d = await get("/assets", SAMPLE_ASSETS);
          setHosts((d && d.hosts) || []);
        }, [get]);

        useEffect(() => {
          loadAssets();
          get("/timeline", SAMPLE_TIMELINE).then((d) =>
            setEvents((d && d.events) || []),
          );
          const id = setInterval(loadAssets, REFRESH_SECONDS * 1000); // muat ulang otomatis
          return () => clearInterval(id);
        }, [get, loadAssets]);

        const openHost = async (ip) => {
          setSelectedIp(ip);
          setDetail(null);
          setPage("detail");
          const d = await get(
            "/assets/" + encodeURIComponent(ip),
            sampleDetail(ip),
          );
          detailRef.current = d;
          setDetail(d);
        };

        const ask = async (query) => {
          const q = String(query || "").trim();
          if (!q) return;
          setPage("chat");
          setMessages((m) => [...m, { role: "user", text: q }]);
          setPending(true);
          let data;
          try {
            const res = await fetch(API + "/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ query: q }),
            });
            if (!res.ok) throw new Error(res.status);
            data = await res.json();
          } catch (e) {
            data = SAMPLE_CHAT;
            setSample(true);
          }
          setPending(false);
          setMessages((m) => [
            ...m,
            {
              role: "assistant",
              text: data.answer,
              sources: data.sources || [],
            },
          ]);
        };

        const askAboutHost = () => {
          const d = detailRef.current;
          const ip = (d && d.ip) || selectedIp;
          const band = (d && d.band) || "berisiko";
          ask(`Kenapa host ${ip} dianggap ${band}? Jelaskan alasannya.`);
        };

        return (
          <div
            style={{
              display: "flex",
              minHeight: "100vh",
              background: "var(--color-bg)",
              color: "var(--color-text)",
              fontFamily: "var(--font-body)",
              fontSize: 14,
            }}
          >
            <Sidebar
              page={page}
              setPage={setPage}
              hasHost={!!selectedIp}
              sample={sample}
            />
            <main
              style={{
                flex: 1,
                minWidth: 0,
                padding: "28px 32px 56px",
                display: "flex",
                flexDirection: "column",
                gap: 24,
              }}
            >
              {page === "dashboard" && (
                <Dashboard hosts={hosts} onOpenHost={openHost} />
              )}
              {page === "timeline" && <Timeline events={events} />}
              {page === "detail" && (
                <HostDetail
                  ip={selectedIp}
                  detail={detail}
                  onBack={() => setPage("dashboard")}
                  onAsk={askAboutHost}
                />
              )}
              {page === "chat" && (
                <Chat messages={messages} pending={pending} onSend={ask} />
              )}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <SentinelOps />,
      );
    </script>
  </body>
